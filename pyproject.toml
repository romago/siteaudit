[project]
name = "site-audit"
version = "0.1.0"
description = "Crawl a website and write an SEO and technical audit report."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Roman Iglin", email = "4romag@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["seo", "audit", "crawler", "sitemap", "robots.txt", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.14.3",
    "rich>=15.0.0",
    "selectolax>=1.0.2",
    "typer>=0.28.0",
]

[project.urls]
Homepage = "https://github.com/romago/siteaudit"
Issues = "https://github.com/romago/siteaudit/issues"

[project.scripts]
siteaudit = "siteaudit.cli:app"

[tool.uv.build-backend]
# The PyPI name is site-audit; the import package and the command stay siteaudit.
module-name = "siteaudit"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT", "RET", "PTH"]

[tool.ruff.lint.per-file-ignores]
"src/siteaudit/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["siteaudit", "tests"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
